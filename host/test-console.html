<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pico + Switch Test Console</title>
<style>
  :root{--bg:#12121f;--panel:#1a1a2e;--edge:#2a2a4a;--fg:#e0e0e0;--dim:#8a8aa0;--accent:#0ff}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100vh;
       display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--panel);
         border-bottom:1px solid var(--edge);flex:none;flex-wrap:wrap}
  header b{color:var(--accent);font-size:14px}
  header label{color:var(--dim);font-size:12px}
  header input{background:var(--bg);color:var(--fg);border:1px solid var(--edge);border-radius:4px;
              padding:4px 6px;font-size:12px;font-family:monospace;width:230px}
  main{flex:1;display:flex;min-height:0}
  .video{flex:1;min-width:0;background:#000;position:relative}
  .controls{width:540px;max-width:48vw;border-left:1px solid var(--edge);background:var(--panel)}
  iframe{border:0;width:100%;height:100%;display:block}
  @media(max-width:860px){
    main{flex-direction:column}
    .controls{width:100%;max-width:none;height:60%;border-left:0;border-top:1px solid var(--edge)}
    .video{height:40%}
  }
</style>
</head>
<body>
<header>
  <b>Test Console</b>
  <label>video <input id="vurl"></label>
  <label>controls <input id="curl"></label>
  <span style="color:var(--dim);font-size:12px">edit + Enter to reload a panel</span>
</header>
<main>
  <div class="video"><iframe id="vframe" allow="autoplay" allowfullscreen></iframe></div>
  <div class="controls"><iframe id="cframe"></iframe></div>
</main>
<script>
  // Defaults — edit here or in the header fields if an IP changes.
  const DEF = {
    v: 'http://192.168.49.103/webrtc.html?group=0&stream=0',   // encoder WebRTC (low latency)
    c: 'http://192.168.49.113/'                                 // Pico control pad
  };
  const $=id=>document.getElementById(id);
  function load(which){
    const inp = which==='v'?$('vurl'):$('curl');
    const frame = which==='v'?$('vframe'):$('cframe');
    frame.src = inp.value;
    try{ localStorage.setItem('tc_'+which, inp.value); }catch(e){}
  }
  for(const k of ['v','c']){
    const inp = k==='v'?$('vurl'):$('curl');
    try{ inp.value = localStorage.getItem('tc_'+k) || DEF[k]; }catch(e){ inp.value = DEF[k]; }
    inp.onkeydown = e=>{ if(e.key==='Enter') load(k); };
    load(k);
  }
</script>
</body>
</html>
