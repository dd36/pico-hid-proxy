<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pico + Switch Test Console</title>
<style>
  :root{--bg:#12121f;--panel:#1a1a2e;--edge:#2a2a4a;--fg:#e0e0e0;--dim:#8a8aa0;--accent:#0ff}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);
       height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--panel);
         border-bottom:1px solid var(--edge);flex:none;flex-wrap:wrap}
  header b{color:var(--accent);font-size:14px}
  header label{color:var(--dim);font-size:12px}
  header input{background:var(--bg);color:var(--fg);border:1px solid var(--edge);border-radius:4px;
              padding:4px 6px;font-size:12px;font-family:monospace;width:210px}
  header small{color:var(--dim);font-size:11px}
  main{flex:1;display:flex;min-height:0}
  /* left column: video on top (16:9), console below */
  .col{display:flex;flex-direction:column;min-height:0;width:640px;max-width:100vw;
       border-right:1px solid var(--edge)}
  .video{flex:none;width:100%;aspect-ratio:16/9;background:#000;position:relative;overflow:hidden}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  .console{flex:1;min-height:0;background:var(--panel)}
  .console iframe{width:100%;height:100%;border:0;display:block}
  .spacer{flex:1;background:#0b0b14}
  @media(max-width:700px){ main{flex-direction:column} .col{width:100%;border-right:0} .spacer{display:none} }
</style>
</head>
<body>
<header>
  <b>Test Console</b>
  <label>encoder <input id="eip"></label>
  <label>controls <input id="curl"></label>
  <small>edit + Enter to reload</small>
</header>
<main>
  <div class="col">
    <div class="video"><iframe id="vframe" allow="autoplay"></iframe></div>
    <div class="console"><iframe id="cframe" allow="gamepad"></iframe></div>
  </div>
  <div class="spacer"></div>
</main>
<script>
  const DEF = { e:'192.168.49.103', c:'http://192.168.49.113/' };
  const $=id=>document.getElementById(id);
  function vsrc(){ return 'http://'+$('eip').value+'/webrtc.html?group=0&stream=0'; }
  function loadV(){ $('vframe').src=vsrc(); try{localStorage.setItem('tc_e',$('eip').value)}catch(e){} }
  function loadC(){ $('cframe').src=$('curl').value; try{localStorage.setItem('tc_c',$('curl').value)}catch(e){} }
  try{ $('eip').value=localStorage.getItem('tc_e')||DEF.e; $('curl').value=localStorage.getItem('tc_c')||DEF.c; }
  catch(e){ $('eip').value=DEF.e; $('curl').value=DEF.c; }
  $('eip').onkeydown=e=>{ if(e.key==='Enter') loadV(); };
  $('curl').onkeydown=e=>{ if(e.key==='Enter') loadC(); };
  loadV(); loadC();
</script>
</body>
</html>
